<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);font-family:Helvetica,Arial,sans-serif;color:var(--text-primary);padding:16px;box-sizing:border-box}.row{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.sw{height:64px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;font-size:9px;font-family:ui-monospace,Menlo,monospace}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;line-height:1.4">
<div style="background:#fdfcfb;border:1px solid var(--border-subtle);padding:10px;display:grid;gap:4px"><span style="color:var(--plum-600);font-weight:700">Pflaume 600 – Text, Links, Buttons</span><span style="color:var(--plum-500);font-weight:700">Pflaume 500 – Überschriften ≥ 18 px, Icons</span><span style="color:var(--plum-300);font-weight:700">Pflaume 300 – nur Fläche, kein Text</span></div>
<div style="background:#fdfcfb;border:1px solid var(--border-subtle);padding:10px;display:grid;gap:4px"><span style="color:var(--orange-700);font-weight:700">Orange 700 – Text auf Hell</span><span style="color:var(--orange-500);font-weight:700">Orange 500 – Marker, Balken, Linien</span><span style="color:var(--orange-300);font-weight:700">Orange 300 – nur Fläche / auf Dunkel</span></div>
<div style="grid-column:1/-1;background:var(--bg-inverse);padding:10px;display:flex;gap:18px"><span style="color:var(--text-on-inverse)">Text auf Dunkel</span><span style="color:var(--plum-300)">Pflaume 300</span><span style="color:var(--orange-300)">Orange 300</span><span style="color:var(--orange-500)">Orange 500</span></div>
</div></body></html>
