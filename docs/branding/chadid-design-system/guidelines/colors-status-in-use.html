<!-- @dsCard group="Colors" viewport="700x170" subtitle="Alert, Badge, Feld, Marken-Hinweis zum Vergleich" name="Status in Anwendung" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);font-family:Helvetica,Arial,sans-serif;color:var(--text-primary);padding:16px;box-sizing:border-box}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:11px">
<div style="display:grid;gap:5px"><div style="background:var(--status-success-bg);border-left:3px solid var(--status-success);padding:6px 10px;color:var(--status-success-text)"><b>Erfolg</b> <span style="color:var(--text-secondary)">Szenario gespeichert.</span></div><div style="background:var(--status-error-bg);border-left:3px solid var(--status-error);padding:6px 10px;color:var(--status-error-text)"><b>Fehler</b> <span style="color:var(--text-secondary)">Szenario gespeichert.</span></div><div style="background:var(--status-warning-bg);border-left:3px solid var(--status-warning);padding:6px 10px;color:var(--status-warning-text)"><b>Warnung</b> <span style="color:var(--text-secondary)">Szenario gespeichert.</span></div><div style="background:var(--status-info-bg);border-left:3px solid var(--status-info);padding:6px 10px;color:var(--status-info-text)"><b>Info</b> <span style="color:var(--text-secondary)">Szenario gespeichert.</span></div></div>
<div style="display:grid;gap:10px;align-content:start"><div style="display:flex;flex-wrap:wrap;gap:4px"><span style="background:var(--status-success-bg);color:var(--status-success-text);padding:3px 8px;border-radius:10px;font-weight:600">Erfolg</span><span style="background:var(--status-error-bg);color:var(--status-error-text);padding:3px 8px;border-radius:10px;font-weight:600">Fehler</span><span style="background:var(--status-warning-bg);color:var(--status-warning-text);padding:3px 8px;border-radius:10px;font-weight:600">Warnung</span><span style="background:var(--status-info-bg);color:var(--status-info-text);padding:3px 8px;border-radius:10px;font-weight:600">Info</span><span style="background:var(--bg-accent-soft);color:var(--text-accent);padding:3px 8px;border-radius:10px;font-weight:600">Hinweis (Marke)</span></div>
<div style="display:grid;gap:3px"><div style="border:1.5px solid var(--status-error);padding:6px 8px;border-radius:4px;background:var(--bg-surface-raised)">anna@klinik</div><span style="color:var(--status-error-text)">Bitte gültige Adresse eingeben.</span></div>
<div style="display:flex;gap:6px"><span style="background:var(--action-primary);color:var(--text-on-brand);padding:6px 10px;border-radius:4px;font-weight:600">Speichern</span><span style="background:var(--action-danger);color:#fff;padding:6px 10px;border-radius:4px;font-weight:600">Löschen</span></div></div></div></body></html>
