<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);font-family:Helvetica,Arial,sans-serif;color:var(--text-primary);padding:16px;box-sizing:border-box}.row{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.sw{height:64px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;font-size:9px;font-family:ui-monospace,Menlo,monospace}</style></head><body><div class="row"><div class="sw" style="background:var(--neutral-0);color:#26212a;border:1px solid var(--neutral-300)">0</div><div class="sw" style="background:var(--neutral-50);color:#26212a;border:1px solid var(--neutral-300)">50</div><div class="sw" style="background:var(--neutral-100);color:#26212a;border:1px solid var(--neutral-300)">100</div><div class="sw" style="background:var(--neutral-200);color:#26212a;border:1px solid var(--neutral-300)">200</div><div class="sw" style="background:var(--neutral-300);color:#26212a;border:1px solid var(--neutral-300)">300</div><div class="sw" style="background:var(--neutral-400);color:#26212a;border:1px solid var(--neutral-300)">400</div><div class="sw" style="background:var(--neutral-500);color:#fdfcfb;border:1px solid var(--neutral-300)">500</div><div class="sw" style="background:var(--neutral-600);color:#fdfcfb;border:1px solid var(--neutral-300)">600</div><div class="sw" style="background:var(--neutral-700);color:#fdfcfb;border:1px solid var(--neutral-300)">700</div><div class="sw" style="background:var(--neutral-800);color:#fdfcfb;border:1px solid var(--neutral-300)">800</div><div class="sw" style="background:var(--neutral-900);color:#fdfcfb;border:1px solid var(--neutral-300)">900</div></div></body></html>
