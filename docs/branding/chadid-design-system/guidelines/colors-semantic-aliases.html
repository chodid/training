<!-- @dsCard group="Colors" viewport="700x200" subtitle="Was wofür: Flächen, Text, Aktionen" name="Semantische Aliase" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);font-family:Helvetica,Arial,sans-serif;color:var(--text-primary);padding:16px;box-sizing:border-box}.row{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.sw{height:64px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;font-size:9px;font-family:ui-monospace,Menlo,monospace}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:11px">
<div style="background:var(--bg-page);border:1px solid var(--border-subtle);padding:10px">bg-page</div>
<div style="background:var(--bg-surface);border:1px solid var(--border-subtle);padding:10px">bg-surface</div>
<div style="background:var(--bg-subtle);padding:10px;color:var(--text-brand)">bg-subtle</div>
<div style="background:var(--bg-inverse);padding:10px;color:var(--text-on-inverse)">bg-inverse</div>
<div style="background:var(--action-primary);padding:10px;color:var(--text-on-brand)">action-primary</div>
<div style="background:var(--action-accent);padding:10px;color:#fff">action-accent</div>
<div style="background:var(--bg-accent-soft);padding:10px;color:var(--text-accent)">bg-accent-soft</div>
<div style="background:var(--bg-surface-raised);padding:10px;border:1px solid var(--border-subtle)"><span style="color:var(--text-primary)">primary</span> · <span style="color:var(--text-secondary)">secondary</span> · <span style="color:var(--text-tertiary)">tertiary</span></div>
<div style="grid-column:1/-1;background:var(--bg-surface-raised);border:1px solid var(--border-subtle);padding:10px;display:flex;gap:16px;align-items:center"><span style="color:var(--link);text-decoration:underline">Link</span><span style="height:3px;width:32px;background:var(--marker)"></span><span style="color:var(--text-accent)">text-accent</span><span style="border:2px solid var(--focus-ring);padding:2px 6px">focus-ring</span></div>
</div></body></html>
