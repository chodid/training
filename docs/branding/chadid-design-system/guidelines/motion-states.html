<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Hover: Orange-Akzent · Fokus: Orange-Ring · 150 ms ease-out" name="Bewegung & Zustände" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--text-primary);padding:16px 20px;box-sizing:border-box;font-size:13px}</style></head><body><style>.b{font:var(--type-button);padding:10px 16px;border-radius:var(--radius-md);cursor:pointer;transition:var(--transition)}.p{background:var(--action-primary);color:var(--text-on-brand)}.p:hover{box-shadow:var(--shadow-focus)}.p:active{background:var(--action-primary-active)}.s{border:var(--border-hover)}.s:hover{border-color:var(--focus-ring)}.c{background:var(--bg-surface);border:var(--border-default);border-radius:var(--radius-lg);padding:12px 14px;cursor:pointer;transition:var(--transition);display:flex;justify-content:space-between}.c:hover{border-color:var(--focus-ring)}</style><div style="display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center"><span class="b p">Primär</span><span class="b s">Sekundär</span><span class="c"><span>Karte (hover)</span><span style="color:var(--text-accent)">→</span></span><span class="b p" style="outline:var(--border-focus);outline-offset:2px">Fokus</span><span class="b p" style="opacity:var(--opacity-disabled);cursor:default">Deaktiviert</span><span style="color:var(--text-tertiary);font-size:12px;grid-column:2/-1">Gedrückt eine Stufe dunkler, keine Verkleinerung · Dialoge 200 ms · nie über 300 ms</span></div></body></html>
