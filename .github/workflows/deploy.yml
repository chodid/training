# Test und Deployment (Konzept D-17, D-20)
#
# test:   bei Push auf main und bei jedem Pull Request – PHPUnit inkl. Migrationstest gegen MySQL, Node-Tests und
#         Browser-Durchlauf der geführten Einheit (Playwright mit dem Chrome des Runners)
# deploy: nur bei Push auf main (bzw. manuell) – Build ohne Dev-Abhängigkeiten, FTPS-Upload von server/,
#         danach Migration über den geschützten Endpunkt und Health-Check
#
# Benötigt im GitHub-Environment "production":
#   Secrets:   FTP_USERNAME, FTP_PASSWORD, MIGRATION_SECRET
#   Variablen: FTP_SERVER, FTP_PORT (optional, Standard 21), FTP_SERVER_DIR, APP_URL
#   FTP_SERVER darf alternativ als Secret angelegt sein (Variable hat Vorrang).
#   FTP_SERVER_DIR ist relativ zum FTP-Login: "/", wenn der FTP-Benutzer nur den Subdomain-Ordner sieht.

name: Test und Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: training_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest -utest"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json, mbstring, openssl, pdo_mysql, zlib
          coverage: none
          tools: composer

      - name: Composer prüfen und installieren
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress

      - name: Assets aus docs/branding übernehmen
        run: php bin/build-assets.php

      - name: PHP-Syntax prüfen
        run: find src public migrations tests templates bin -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: training_test
          TEST_DB_USER: test
          TEST_DB_PASSWORD: test
        run: vendor/bin/phpunit

      # Geführte Einheit S9 (AP-14 T5): Kern des Seitenskripts ohne Browser, dann Browser-Durchlauf mit dem
      # vorinstallierten Chrome des Runners (Playwright ohne eigenen Browser-Download)
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Skript-Tests (Node)
        run: node --test tests/js/*.test.cjs

      - name: Browser-Test geführte Einheit (Playwright)
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: training_test
          TEST_DB_USER: test
          TEST_DB_PASSWORD: test
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix tests/e2e playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" bash tests/e2e/run.sh

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Build ohne Dev-Abhängigkeiten
        working-directory: server
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          php bin/build-assets.php

      - name: Konfiguration prüfen
        id: cfg
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          APP_URL: ${{ vars.APP_URL }}
          HAS_USER: ${{ secrets.FTP_USERNAME != '' }}
          HAS_PASSWORD: ${{ secrets.FTP_PASSWORD != '' }}
          HAS_MIGRATION_SECRET: ${{ secrets.MIGRATION_SECRET != '' }}
        run: |
          missing=""
          [ -n "$FTP_SERVER" ] || missing="$missing FTP_SERVER"
          [ -n "$FTP_SERVER_DIR" ] || missing="$missing FTP_SERVER_DIR"
          [ -n "$APP_URL" ] || missing="$missing APP_URL"
          [ "$HAS_USER" = "true" ] || missing="$missing FTP_USERNAME"
          [ "$HAS_PASSWORD" = "true" ] || missing="$missing FTP_PASSWORD"
          [ "$HAS_MIGRATION_SECRET" = "true" ] || missing="$missing MIGRATION_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Im Environment 'production' fehlen:$missing"
            exit 1
          fi
          echo "server_dir=${FTP_SERVER_DIR%/}/" >> "$GITHUB_OUTPUT"
          echo "app_url=${APP_URL%/}" >> "$GITHUB_OUTPUT"

      # Lädt nur geänderte Dateien hoch (Statusdatei auf dem Server). Dateien, die der Workflow nie
      # hochgeladen hat (.env, backups/, var/), werden weder überschrieben noch gelöscht; zusätzlich ausgeschlossen.
      - name: Upload per FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          port: ${{ vars.FTP_PORT || 21 }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./server/
          server-dir: ${{ steps.cfg.outputs.server_dir }}
          exclude: |
            **/.git*
            **/.git*/**
            .env
            backups/**
            var/**
            bin/**
            tests/**
            phpunit.xml.dist
            .phpunit.cache/**

      - name: Migration auslösen
        env:
          MIGRATION_SECRET: ${{ secrets.MIGRATION_SECRET }}
          APP_URL: ${{ steps.cfg.outputs.app_url }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "X-Migration-Secret: ${MIGRATION_SECRET}" \
            "${APP_URL}/admin/migrate"

      - name: Health-Check
        env:
          APP_URL: ${{ steps.cfg.outputs.app_url }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "${APP_URL}/health"
